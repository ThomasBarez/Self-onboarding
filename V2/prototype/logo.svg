<svg width="55" height="55" viewBox="0 0 55 55" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded rectangle -->
  <rect width="55" height="55" rx="12" fill="#00D563"/>
  
  <!-- Stylized X symbol - two crossing diagonal bars -->
  <g transform="translate(27.5, 20)">
    <!-- First diagonal bar (top-left to bottom-right) -->
    <rect x="-2" y="-10" width="4" height="20" rx="2" fill="#221C46" transform="rotate(45)"/>
    
    <!-- Second diagonal bar (top-right to bottom-left) -->
    <rect x="-2" y="-10" width="4" height="20" rx="2" fill="#221C46" transform="rotate(-45)"/>
  </g>
  
  <!-- "mobility" text -->
  <text x="27.5" y="48" text-anchor="middle" font-family="'TT Travels', -apple-system, Arial, sans-serif" font-size="5.5" fill="#221C46" font-weight="500" letter-spacing="0.3">mobility</text>
</svg>
