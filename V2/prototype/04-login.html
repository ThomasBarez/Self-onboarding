<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mobility</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'TT Travels', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #FAF8FF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: white;
            border: 1px solid rgba(208, 202, 244, 0.5);
            border-radius: 32px;
            width: 406px;
            padding: 48px 32px 32px;
            display: flex;
            flex-direction: column;
            gap: 48px;
            align-items: center;
        }

        .icon-container {
            width: 55px;
            height: 55px;
            background: #00D563;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-x {
            font-size: 32px;
            font-weight: 700;
            color: #221C46;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
            width: 100%;
        }

        h1 {
            font-family: 'TT Travels', sans-serif;
            font-weight: 700;
            font-size: 24px;
            line-height: 32px;
            color: #362F54;
        }

        .description {
            font-family: 'TT Travels', sans-serif;
            font-weight: 400;
            font-size: 14px;
            line-height: 20px;
            color: #4B5563;
        }

        .form-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-field {
            width: 100%;
            padding: 16px 12px 8px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            font-family: 'TT Travels', sans-serif;
            font-size: 14px;
            line-height: 20px;
            color: #221C46;
            background: white;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #2BFD7F;
        }

        .input-label {
            position: absolute;
            left: 12px;
            top: 6px;
            font-family: 'TT Travels', sans-serif;
            font-size: 11px;
            line-height: 14px;
            color: #6B7280;
            pointer-events: none;
        }

        .forgot-password {
            font-family: 'TT Travels', sans-serif;
            font-size: 13px;
            line-height: 20px;
            color: #221C46;
            text-decoration: underline;
            text-align: left;
            margin-top: -12px;
        }

        .btn-primary {
            background: #2BFD7F;
            border: 3px solid #2BFD7F;
            color: #362F54;
            font-family: 'TT Travels', sans-serif;
            font-weight: 500;
            font-size: 14px;
            line-height: 20px;
            padding: 8px 16px;
            height: 44px;
            border-radius: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-primary:hover {
            background: #45FD8F;
            border-color: #45FD8F;
        }

        .language-selector {
            position: fixed;
            top: 24px;
            right: 24px;
            background: white;
            border-radius: 100px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
        }

        .language-icon {
            width: 16px;
            height: 16px;
        }

        .language-text {
            font-family: 'TT Travels', sans-serif;
            font-weight: 500;
            font-size: 14px;
            line-height: 20px;
            color: #463F5F;
        }

        .footer {
            position: fixed;
            bottom: 24px;
            left: 24px;
            display: flex;
            gap: 32px;
            font-family: 'TT Travels', sans-serif;
            font-weight: 400;
            font-size: 14px;
            line-height: 20px;
            color: #463F5F;
        }

        .footer a {
            color: inherit;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="language-selector">
        <svg class="language-icon" viewBox="0 0 16 16" fill="none">
            <path d="M8 14C11.3137 14 14 11.3137 14 8C14 4.68629 11.3137 2 8 2C4.68629 2 2 4.68629 2 8C2 11.3137 4.68629 14 8 14Z" stroke="#463F5F" stroke-width="1.5"/>
            <path d="M2 8H14M8 2C9.5 4 10 6 10 8C10 10 9.5 12 8 14C6.5 12 6 10 6 8C6 6 6.5 4 8 2Z" stroke="#463F5F" stroke-width="1.5"/>
        </svg>
        <span class="language-text">English</span>
    </div>

    <div class="modal-card">
        <div class="icon-container">
            <span class="icon-x">✕</span>
        </div>

        <div class="content">
            <h1>Welcome to Pluxee</h1>
            <p class="description">
                Log in to access your mobility dashboard and manage your benefits.
            </p>
        </div>

        <form class="form-section" action="04a-upload-data.html">
            <div class="input-group">
                <label class="input-label">Email</label>
                <input type="email" class="input-field" placeholder="your@email.com">
            </div>

            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" class="input-field" placeholder="••••••••">
            </div>

            <a href="#" class="forgot-password">Forgot your password?</a>

            <button type="submit" class="btn-primary">Continue</button>
        </form>
    </div>

    <div class="footer">
        <a href="#">Privacy & terms</a>
        <a href="#">Cookie policy</a>
    </div>
</body>
</html>
